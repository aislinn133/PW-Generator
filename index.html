<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="bg-div">

            <h1>
                <span class="span1-h1">Generate a</span> 
                <br />
                <span class="span2-h2">random password</span>
            </h1>

            <p>Never use an insecure password again.</p> 

            <label id="lable-digit"
                   for="digit">Number of Digit (4-25)
            </label>
            <br />
            <input type="text"
                   placeholder="Example: 17"
                   id="digit"
                   onfocus="this.value=''"
                   autocomplete="off">
            <button id="generate-btn">Generate passwords</button>

            <p class="invalid"></p>
            <hr>

            <button id="pw-btn1" class="style-btn"
                    onclick="copyToClipboard(this)">
            </button>
            <br/>
            <button id="pw-btn2" class="style-btn"
                    onclick="copyToClipboard(this)">
            </button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
